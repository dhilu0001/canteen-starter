<!doctype html>
<!--
  ─────────────────────────────────────────────────────────────
   THE 90-SECOND "WHY REACT" DEMO
   Open this file directly in a browser. No build, no install.

   This is the SAME cart as checkpoint 4, written the old way.
   It works perfectly. That is the point — React is not here to
   make impossible things possible.

   Look at updateScreen() below. Every single time anything
   changes, YOU have to remember to update all five places by
   hand. Forget one, and the screen lies to the user.

   In React that whole function does not exist. You change the
   data, and the screen follows.
  ─────────────────────────────────────────────────────────────
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Canteen — the old way</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f7; margin: 0; color: #1a1d26; }
    .app { max-width: 560px; margin: 0 auto; background: #fff; min-height: 100vh; }
    .header, .footer { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; }
    .header { border-bottom: 1px solid #e2e4ea; }
    .footer { border-top: 1px solid #e2e4ea; }
    .header h1 { font-size: 1.15rem; margin: 0; }
    .pill { background: #d98324; color: #fff; padding: 5px 12px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
    .item { display: flex; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 1px solid #e2e4ea; }
    .name { flex: 1; }
    .price { color: #6b7080; }
    button { font: inherit; cursor: pointer; border: 0; background: #d98324; color: #fff; padding: 6px 14px; border-radius: 10px; font-weight: 600; }
    .empty { padding: 28px 20px; text-align: center; color: #6b7080; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Campus Canteen</h1>
      <span class="pill" id="cart-count">Cart: 0</span>
    </div>

    <div id="menu"></div>

    <p class="empty" id="empty-msg">Your cart is empty. Add something.</p>

    <div class="footer" id="footer" style="display:none">
      <span id="item-count">0 items</span>
      <strong id="total">₹0</strong>
    </div>
  </div>

<script>
  const menu = [
    { id: 4, name: 'Puttu & Kadala',   price: 40 },
    { id: 5, name: 'Masala Dosa',      price: 50 },
    { id: 8, name: 'Chicken Biriyani', price: 140 },
  ];

  let cart = [];

  // Build the list by hand, once.
  const menuEl = document.getElementById('menu');
  menu.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML =
      '<span class="name"></span><span class="price"></span>';
    row.querySelector('.name').textContent  = item.name;
    row.querySelector('.price').textContent = '₹' + item.price;

    const btn = document.createElement('button');
    btn.textContent = 'Add';
    btn.addEventListener('click', () => {
      cart.push(item);
      updateScreen();          // ← if you forget this line, nothing happens
    });

    row.appendChild(btn);
    menuEl.appendChild(row);
  });

  // ─── THIS is the function React deletes ───────────────────
  function updateScreen() {
    const total = cart.reduce((sum, i) => sum + i.price, 0);

    document.getElementById('cart-count').textContent = 'Cart: ' + cart.length;   // 1
    document.getElementById('item-count').textContent = cart.length + ' items';   // 2
    document.getElementById('total').textContent      = '₹' + total;              // 3
    document.getElementById('empty-msg').style.display = cart.length ? 'none' : 'block'; // 4
    document.getElementById('footer').style.display    = cart.length ? 'flex' : 'none';  // 5
  }
  // Five manual updates. For ONE click.
  // Add a discount, a delivery charge, a "you saved ₹X" line —
  // every new feature means remembering to add another line here.
  // ──────────────────────────────────────────────────────────
</script>
</body>
</html>
